<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<div
id="map"
style="
height:100vh;
">
</div>

<script>

let trip=

JSON.parse(

localStorage.getItem(
"selectedTrip"
)

);

let map=
L.map("map");

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"

).addTo(map);

let marker=
L.marker(

[
trip[0].lat,
trip[0].lng
]

).addTo(map);

map.setView(

[
trip[0].lat,
trip[0].lng
],

15
);

let i=0;

setInterval(()=>{

if(
i<trip.length
){

marker.setLatLng(

[
trip[i].lat,
trip[i].lng
]

);

i++;

}

},1000);

</script>

</body>
</html>
