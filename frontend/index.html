<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autonomous Fleet AI Platform</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <!-- CHART -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- LEAFLET -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- ROUTING -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:'Poppins',sans-serif;
            background:#0f172a;
            color:white;
        }

        header{
            background:#1e293b;
            padding:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
            position:sticky;
            top:0;
            z-index:999;
        }

        .container{
            padding:20px;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:15px;
            margin-bottom:20px;
            box-shadow:0 0 15px rgba(0,0,0,0.4);
        }

        h2{
            color:#60a5fa;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:15px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        #map{
            height:500px;
            width:100%;
            margin-top:20px;
            border-radius:15px;
            overflow:hidden;
        }

        canvas{
            background:white;
            border-radius:10px;
            margin-top:20px;
            padding:10px;
        }

        .status-box{
            margin-top:20px;
            background:#0f172a;
            padding:15px;
            border-radius:10px;
        }

    </style>

</head>

<body>

<header>

    🚗 Autonomous Fleet AI Platform

</header>

<div class="container">

    <!-- ROUTE -->
    <div class="card">

        <h2>🗺 Smart Route Navigation</h2>

        <input id="startLocation"
               placeholder="Enter Start Location">

        <input id="endLocation"
               placeholder="Enter Destination">

        <button onclick="findRoute()">

            Find Shortest Route

        </button>

        <button onclick="startRealTracking()"
                style="background:#22c55e;">

            ▶ Start Trip

        </button>

        <button onclick="stopTrip()"
                style="background:#ef4444;">

            ⏹ End Trip

        </button>

        <div class="status-box">

            <p>
                Trip Status:
                <span id="tripStatus"
                      style="color:#ef4444;font-weight:bold;">

                    NOT STARTED

                </span>
            </p>

            <p>
                Current Speed:
                <span id="currentSpeed">0</span> km/h
            </p>

            <p>
                Brake Events:
                <span id="totalBrake">0</span>
            </p>

            <p>
                Acceleration Events:
                <span id="totalAccel">0</span>
            </p>

            <hr>

            <h3>🚦 Live Traffic Status</h3>

            <p>
                Traffic Level:
                <span id="trafficLevel">

                    Loading...

                </span>
            </p>

            <p>
                Estimated Delay:
                <span id="trafficDelay">0</span> mins
            </p>

        </div>

        <div id="map"></div>

    </div>

</div>

<script>

let map;
let routingControl;
let vehicleMarker;

let watchId = null;
let tripData = [];

let previousLat = null;
let previousLng = null;
let previousTime = null;
let previousSpeed = 0;

let totalBrakeEvents = 0;
let totalAccelEvents = 0;

let trafficInterval = null;

// ======================
// MAP INIT
// ======================

window.onload = function () {

    map = L.map("map").setView([20.5937,78.9629],5);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);

    let blueIcon = L.icon({

        iconUrl:
        "https://cdn-icons-png.flaticon.com/512/684/684908.png",

        iconSize:[35,35],
        iconAnchor:[17,35]

    });

    vehicleMarker = L.marker(
        [20.5937,78.9629],
        {icon:blueIcon}
    ).addTo(map);

    // ENTER KEY SEARCH

    document
    .getElementById("endLocation")
    .addEventListener("keypress",function(e){

        if(e.key==="Enter"){

            findRoute();

        }

    });

};

// ======================
// FIND ROUTE
// ======================

async function findRoute(){

    let start =
    document.getElementById(
        "startLocation"
    ).value;

    let end =
    document.getElementById(
        "endLocation"
    ).value;

    if(!end){

        alert("Enter destination");
        return;

    }

    let startLat;
    let startLng;

    // CURRENT LOCATION

    if(start.trim()===""){

        const position =
        await new Promise((resolve,reject)=>{

            navigator.geolocation.getCurrentPosition(
                resolve,
                reject
            );

        });

        startLat =
        position.coords.latitude;

        startLng =
        position.coords.longitude;

    }

    // MANUAL LOCATION

    else{

        let startRes =
        await fetch(
`https://nominatim.openstreetmap.org/search?format=json&q=${start}`
        );

        let startData =
        await startRes.json();

        startLat =
        parseFloat(startData[0].lat);

        startLng =
        parseFloat(startData[0].lon);

    }

    // DESTINATION

    let endRes =
    await fetch(
`https://nominatim.openstreetmap.org/search?format=json&q=${end}`
    );

    let endData =
    await endRes.json();

    let endLat =
    parseFloat(endData[0].lat);

    let endLng =
    parseFloat(endData[0].lon);

    // REMOVE OLD ROUTE

    if(routingControl){

        map.removeControl(routingControl);

    }

    // CREATE NEW ROUTE

    routingControl =
    L.Routing.control({

        waypoints:[

            L.latLng(startLat,startLng),

            L.latLng(endLat,endLng)

        ],

        routeWhileDragging:false,
        draggableWaypoints:false,
        addWaypoints:false

    }).addTo(map);

    map.setView([startLat,startLng],13);

    vehicleMarker.setLatLng(
        [startLat,startLng]
    );

    // AUTO OPEN MAP

    document
    .getElementById("map")
    .scrollIntoView({

        behavior:"smooth",

        block:"start"

    });

    // FIX MOBILE RENDER

    setTimeout(()=>{

        map.invalidateSize();

    },500);

    // TRAFFIC

    getTrafficData(endLat,endLng);

    // AUTO REFRESH

    if(trafficInterval){

        clearInterval(
            trafficInterval
        );

    }

    trafficInterval =
    setInterval(()=>{

        getTrafficData(
            endLat,
            endLng
        );

    },15000);

}

// ======================
// TRAFFIC API
// ======================

async function getTrafficData(lat,lng){

    const apiKey =
    "18tEsbkhPAl9eB59hMx6V7QDPfH5QNXC";

    const url =
`https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json?point=${lat},${lng}&key=${apiKey}`;

    try{

        const response =
        await fetch(url);

        const data =
        await response.json();

        if(!data.flowSegmentData){

            document.getElementById(
                "trafficLevel"
            ).innerText="Unavailable";

            return;

        }

        let currentSpeed =
        data.flowSegmentData.currentSpeed;

        let freeFlowSpeed =
        data.flowSegmentData.freeFlowSpeed;

        let delay =
        freeFlowSpeed-currentSpeed;

        let traffic="Low";

        if(delay>20){

            traffic="High";

        }

        else if(delay>10){

            traffic="Moderate";

        }

        document.getElementById(
            "trafficLevel"
        ).innerText=traffic;

        document.getElementById(
            "trafficDelay"
        ).innerText=Math.round(delay);

    }

    catch(error){

        console.log(error);

        document.getElementById(
            "trafficLevel"
        ).innerText="Error";

    }

}

// ======================
// START TRACKING
// ======================

function startRealTracking(){

    document.getElementById(
        "tripStatus"
    ).innerText="TRIP STARTED";

    document.getElementById(
        "tripStatus"
    ).style.color="#22c55e";

}

// ======================
// STOP TRACKING
// ======================

function stopTrip(){

    document.getElementById(
        "tripStatus"
    ).innerText="TRIP ENDED";

    document.getElementById(
        "tripStatus"
    ).style.color="#ef4444";

}

</script>

</body>
</html>
