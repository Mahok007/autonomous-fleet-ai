<!DOCTYPE html>
<html lang="en">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Fleet AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
 
  <style>
    * { box-sizing: border-box; }
 
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
 
    .box {
      width: 400px;
      background: #1e293b;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }
 
    h1 { color: #5978ff; margin-top: 0; font-size: 24px; }
    p  { color: #94a3b8; font-size: 14px; }
 
    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: white;
      outline: none;
    }
    input::placeholder { color: #64748b; }
    input:focus { box-shadow: 0 0 0 2px #627cff; }
 
    button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      background: #627cff;
      color: white;
      transition: background 0.2s;
    }
    button:hover { background: #4564ff; }
    button:disabled { background: #334155; cursor: not-allowed; }
 
    .msg {
      margin-top: 14px;
      font-size: 13px;
      font-weight: bold;
      min-height: 18px;
    }
 
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #ffffff44;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
 
    .panel { display: none; }
    .panel.active { display: block; }
    .big-icon { font-size: 56px; margin-bottom: 8px; }
  </style>
</head>
 
<body>
<div class="box">
 
  <h1>🔑 Reset Password</h1>
 
  <!-- ======= RESET FORM ======= -->
  <div id="panelForm" class="panel active">
    <p>Enter your new password below.</p>
    <input type="password" id="newPassword"    placeholder="New password (min. 8 characters)" autocomplete="new-password">
    <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
    <button id="btnReset" onclick="resetPassword()">🔐 Set New Password</button>
    <div class="msg" id="msg"></div>
  </div>
 
  <!-- ======= SUCCESS ======= -->
  <div id="panelSuccess" class="panel">
    <div class="big-icon">✅</div>
    <h2 style="color:#22c55e;">Password Updated!</h2>
    <p>Your password has been changed successfully.</p>
    <button onclick="window.location.href='login.html'">🔐 Go to Login</button>
  </div>
 
  <!-- ======= INVALID TOKEN ======= -->
  <div id="panelError" class="panel">
    <div class="big-icon">❌</div>
    <h2 style="color:#f87171;">Invalid or Expired Link</h2>
    <p>This reset link is invalid or has already been used.</p>
    <button onclick="window.location.href='login.html'">← Back to Login</button>
  </div>
 
</div>
 
<script>
  const API = "https://autonomous-fleet-ai-1.onrender.com/auth";
 
  // Read token from URL:  reset-password.html?token=XXXX
  const params = new URLSearchParams(window.location.search);
  const TOKEN  = params.get("token");
 
  if (!TOKEN) {
    showPanel("panelError");
  }
 
  function showPanel(id) {
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }
 
  async function resetPassword() {
    let btn     = document.getElementById("btnReset");
    let newPwd  = document.getElementById("newPassword").value;
    let confirm = document.getElementById("confirmPassword").value;
    let msg     = document.getElementById("msg");
 
    if (!newPwd || !confirm) {
      msg.style.color = "orange";
      msg.innerText = "⚠ Please fill in both fields.";
      return;
    }
    if (newPwd.length < 8) {
      msg.style.color = "orange";
      msg.innerText = "⚠ Password must be at least 8 characters.";
      return;
    }
    if (newPwd !== confirm) {
      msg.style.color = "orange";
      msg.innerText = "⚠ Passwords do not match.";
      return;
    }
 
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Updating...';
 
    try {
      const res  = await fetch(`${API}/reset/${TOKEN}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: newPwd })
      });
      const data = await res.json();
 
      if (res.ok) {
        showPanel("panelSuccess");
      } else {
        let errMsg = data.detail?.message || data.message || "Reset failed.";
        if (errMsg.toLowerCase().includes("invalid")) {
          showPanel("panelError");
        } else {
          msg.style.color = "#f87171";
          msg.innerText = "❌ " + errMsg;
          btn.disabled = false;
          btn.innerText = "🔐 Set New Password";
        }
      }
    } catch (e) {
      console.error(e);
      msg.style.color = "#f87171";
      msg.innerText = "❌ Could not reach server.";
      btn.disabled = false;
      btn.innerText = "🔐 Set New Password";
    }
  }
 
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") resetPassword();
  });
</script>
 
</body>
</html>
