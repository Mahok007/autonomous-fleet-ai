<!DOCTYPE html>
<html>

<head>

    <title>Fleet AI Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {

            background: #1e293b;

            padding: 40px;

            border-radius: 15px;

            width: 350px;

            box-shadow: 0 0 20px rgba(0,0,0,0.5);

            color: white;
        }

        h1 {
            text-align: center;
            color: #60a5fa;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-top: 15px;

            border-radius: 8px;

            border: none;
        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 20px;

            background: #3b82f6;

            border: none;

            border-radius: 8px;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        #error {
            color: red;
            margin-top: 15px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>🚗 Fleet AI Login</h1>

    <input id="username" placeholder="Username">

    <input id="password"
           type="password"
           placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <div id="error"></div>

</div>

<script>

function login() {

    let username =
        document.getElementById("username").value;

    let password =
        document.getElementById("password").value;

    fetch(`http://127.0.0.1:8000/login?username=${username}&password=${password}`, {

        method: "POST"

    })

    .then(res => res.json())

    .then(data => {

        if (data.error) {

            document.getElementById("error").innerText =
                data.error;

            return;
        }

        // SAVE TOKEN
        localStorage.setItem(
            "token",
            data.access_token
        );

        // REDIRECT
        window.location.href = "index.html";
    });
}

</script>

</body>
</html>
