<!DOCTYPE html>
<html>

<head>

<title>Fleet AI Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>

body{

margin:0;
padding:0;

font-family:Poppins;

background:#0f172a;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.login-box{

background:#1e293b;

padding:40px;

border-radius:15px;

width:380px;

box-shadow:0 0 20px rgba(0,0,0,.5);

text-align:center;

}

h1{

color:#4f74ff;

margin-bottom:30px;

}

input{

width:100%;

padding:12px;

margin-top:15px;

border:none;

border-radius:8px;

font-size:15px;

box-sizing:border-box;

outline:none;

}

button{

width:100%;

padding:12px;

margin-top:18px;

border:none;

border-radius:8px;

background:#5b7cff;

color:white;

font-size:18px;

cursor:pointer;

}

button:hover{

background:#3d61f7;

}

#message{

margin-top:20px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="login-box">

<h1>🚗 Fleet AI Login</h1>

<input
type="email"
id="email"
placeholder="Enter Email"
autocomplete="off"
>

<input
type="password"
id="password"
placeholder="Password (minimum 8 characters)"
autocomplete="new-password"
>

<input
type="text"
id="username"
placeholder="Username (registration only)"
autocomplete="off"
>

<input
type="email"
id="forgotEmail"
placeholder="Email for password recovery"
autocomplete="off"
>

<button onclick="login()">
Login
</button>

<button onclick="registerUser()">
Register
</button>

<button onclick="forgotPassword()">
Forgot Password
</button>

<div id="message"></div>

</div>


<script>

const API=

"https://autonomous-fleet-ai-1.onrender.com/auth";



async function login(){

try{

console.log(
"login clicked"
);

let email=
document.getElementById(
"email"
).value.trim();

let password=
document.getElementById(
"password"
).value;


const response=

await fetch(

API+"/login",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

email,
password

})

}

);

const data=
await response.json();

console.log(data);


if(data.access_token){

localStorage.setItem(

"token",

data.access_token

);

document.getElementById(
"message"
).style.color=
"#22c55e";

document.getElementById(
"message"
).innerText=
"Login Successful";


setTimeout(()=>{

window.location.href=
"index.html";

},1000);

}

else{

document.getElementById(
"message"
).style.color=
"red";

document.getElementById(
"message"
).innerText=

data.message ||

"Wrong email or password";

}

}

catch(error){

console.log(error);

document.getElementById(
"message"
).style.color=
"red";

document.getElementById(
"message"
).innerText=

"Backend connection failed";

}

}



async function registerUser(){

try{

let username=
document.getElementById(
"username"
).value.trim();

let email=
document.getElementById(
"email"
).value.trim();

let password=
document.getElementById(
"password"
).value;


if(
username==""
||
email==""
||
password==""
){

alert(
"Fill all fields"
);

return;

}


if(
password.length<8
){

alert(
"Password must contain minimum 8 characters"
);

return;

}


const response=

await fetch(

API+"/register",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username,
email,
password

})

}

);


const data=
await response.json();

console.log(data);


document.getElementById(
"message"
).style.color=
"#22c55e";


document.getElementById(
"message"
).innerText=

data.message;

}

catch(error){

console.log(error);

document.getElementById(
"message"
).style.color=
"red";

document.getElementById(
"message"
).innerText=

"Registration failed";

}

}



async function forgotPassword(){

try{

let email=
document.getElementById(
"forgotEmail"
).value.trim();


if(email==""){

alert(
"Enter recovery email"
);

return;

}


const response=

await fetch(

API+"/forgot",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

email

})

}

);


const data=
await response.json();


document.getElementById(
"message"
).style.color=
"orange";


document.getElementById(
"message"
).innerText=

data.resetToken

?

"Reset token: "+data.resetToken

:

data.message;

}

catch(error){

console.log(error);

}

}



document.addEventListener(

"keydown",

function(e){

if(
e.key==="Enter"
){

login();

}

}

);

</script>

</body>
</html>
