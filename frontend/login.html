<!DOCTYPE html>
<html>

<head>
<title>Fleet AI Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{

width:380px;

background:#1e293b;

padding:40px;

border-radius:20px;

text-align:center;

box-shadow:0 0 25px rgba(0,0,0,.5);

}

h1{

color:#5978ff;

}

input{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:10px;

box-sizing:border-box;

font-size:16px;

}

button{

width:100%;

padding:14px;

margin-top:18px;

border:none;

border-radius:10px;

background:#627cff;

color:white;

font-size:18px;

cursor:pointer;

}

button:hover{

background:#4564ff;

}

#message{

margin-top:20px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="login-box">

<h1>🚗 Fleet AI Login</h1>

<input
type="email"
id="email"
placeholder="Enter Email"
>

<input
type="password"
id="password"
placeholder="Password (min 8 characters)"
>

<div id="registerFields">

<input
type="text"
id="username"
placeholder="Username"
>

</div>

<input
type="email"
id="forgotEmail"
placeholder="Recovery Email"
>

<button onclick="login()">
Login
</button>

<button onclick="registerUser()">
Register
</button>

<button onclick="forgotPassword()">
Forgot Password
</button>

<div id="message"></div>

</div>


<script>

const API=
"https://autonomous-fleet-ai-1.onrender.com/auth";



async function registerUser(){

try{

let username=
document.getElementById(
"username"
).value.trim();

let email=
document.getElementById(
"email"
).value.trim();

let password=
document.getElementById(
"password"
).value;


if(
username==""
||
email==""
||
password==""
){

alert(
"Fill all fields"
);

return;

}


if(
password.length<8
){

alert(
"Password minimum 8 characters"
);

return;

}


const response=

await fetch(

API+"/register",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username,
email,
password

})

}

);

const data=
await response.json();


if(
data.message==
"Registered Successfully"
){

alert(
"Registered Successfully"
);

document.getElementById(
"registerFields"
).style.display=
"none";


document.getElementById(
"message"
).innerText=

"Now Login";

}

else{

alert(
data.message
);

}

}

catch(error){

console.log(error);

alert(
"Registration Failed"
);

}

}




async function login(){

try{

let email=
document.getElementById(
"email"
).value.trim();

let password=
document.getElementById(
"password"
).value;


const response=

await fetch(

API+"/login",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password

})

}

);


const data=
await response.json();


if(data.access_token){

localStorage.setItem(

"token",

data.access_token

);


alert(
"Login Successful"
);


window.location.href=
"index.html";

}

else{

document.getElementById(
"message"
).style.color=
"red";

document.getElementById(
"message"
).innerText=

data.message||

"Wrong email or password";

}

}

catch(error){

console.log(error);

alert(
"Backend connection failed"
);

}

}




async function forgotPassword(){

let email=

document.getElementById(
"forgotEmail"
).value;


if(email==""){

alert(
"Enter Email"
);

return;

}


const response=

await fetch(

API+"/forgot",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email

})

}

);


const data=
await response.json();


alert(

data.resetToken

?

"Reset Token:\n"+data.resetToken

:

data.message

);

}



document.addEventListener(

"keydown",

e=>{

if(
e.key==="Enter"
){

login();

}

}

);

</script>

</body>
</html>
