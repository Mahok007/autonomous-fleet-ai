<!DOCTYPE html>
<html>

<head>

    <title>Fleet AI Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: 'Poppins', sans-serif;

            background: #0f172a;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;
        }

        .login-box {

            background: #1e293b;

            padding: 40px;

            border-radius: 15px;

            width: 350px;

            box-shadow: 0 0 20px rgba(0,0,0,0.5);

            text-align: center;
        }

        h1 {

            color: #3b82f6;

            margin-bottom: 30px;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            box-sizing: border-box;
        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 20px;

            border: none;

            border-radius: 8px;

            background: #3b82f6;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            background: #2563eb;
        }

        #message {

            margin-top: 20px;

            color: #22c55e;

            font-weight: bold;
        }

    </style>

</head>

<body>

 <div class="login-box">

<h1>🚗 Fleet AI Login</h1>

<input
type="email"
id="email"
placeholder="Enter Email"
>

<input
type="password"
id="password"
placeholder="Enter Password"
>

<button onclick="login()">
Login
</button>

<button onclick="registerUser()">
Register
</button>

<button onclick="forgotPassword()">
Forgot Password
</button>

<div id="message"></div>

</div>

<script>

// =========================
// LOGIN FUNCTION
// =========================

async function login(){

let email=
document.getElementById(
"email"
).value;

let password=
document.getElementById(
"password"
).value;

const response=

await fetch(

"https://autonomous-fleet-ai-1.onrender.com/auth/login",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,
password:password

})

}

);

const data=
await response.json();

if(data.access_token){

localStorage.setItem(
"token",
data.access_token
);

document.getElementById(
"message"
).style.color=
"#22c55e";

document.getElementById(
"message"
).innerText=
"Login Successful";

setTimeout(()=>{

window.location.href=
"index.html";

},1000);

}

else{

document.getElementById(
"message"
).style.color=
"#ef4444";

document.getElementById(
"message"
).innerText=

data.message ||
"Login Failed";

}

}



async function registerUser(){

let username=
prompt(
"Enter Username"
);

let email=
document.getElementById(
"email"
).value;

let password=
document.getElementById(
"password"
).value;


const response=

await fetch(

"https://autonomous-fleet-ai-1.onrender.com/auth/register",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:username,

email:email,

password:password

})

}

);

const data=
await response.json();

alert(
data.message
);

}



async function forgotPassword(){

let email=
prompt(
"Enter Email"
);

const response=

await fetch(

"https://autonomous-fleet-ai-1.onrender.com/auth/forgot",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email

})

}

);

const data=
await response.json();

alert(

"Reset Token:\n"

+

data.resetToken

);

}



document.addEventListener(

"keydown",

function(e){

if(
e.key==="Enter"
){

login();

}

}

);

</script>

</body>
</html>
